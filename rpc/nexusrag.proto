syntax = "proto3";


service RetrievalService {
    rpc RetrieveSimilarLines (RetrievalRequest) returns (RetrievalResponse);
}


// Experiment 4: Ricart-Agrawala Mutual Exclusion
service MutexService {
    rpc RequestCriticalSection (MutexRequest) returns (MutexResponse);
}


// ============================================================
// Experiment 7: Eventual Consistency via Gossip Replication
// ============================================================

service ReplicaService {
    rpc SaveValue (ValueUpdate) returns (SaveAck);
    rpc SyncUpdate (ValueUpdate) returns (SaveAck);
    rpc GetValue (ValueQuery) returns (ValueState);
}


// ------------------------------------------------------------
// Existing NexusRAG Retrieval Messages
// ------------------------------------------------------------

message RetrievalRequest {
    string character_name = 1;
    string manga_id = 2;
    string query_text = 3;
    int32 limit = 4;
    int32 lamport_timestamp = 5;
}


message ApprovedLine {
    string panel_id = 1;
    string original_japanese = 2;
    string final_output = 3;
    int64 created_at = 4;
}


message RetrievalResponse {
    repeated ApprovedLine lines = 1;
    int32 lamport_timestamp = 2;
}


// ------------------------------------------------------------
// Experiment 4: Ricart-Agrawala Messages
// ------------------------------------------------------------

message MutexRequest {
    int32 node_id = 1;
    int32 lamport_timestamp = 2;
}


message MutexResponse {
    bool granted = 1;
    int32 lamport_timestamp = 2;
}


// ------------------------------------------------------------
// Experiment 7: Replication Messages
// ------------------------------------------------------------

message ValueUpdate {
    string key = 1;
    string content = 2;
    int32 lamport_timestamp = 3;
    string origin_replica = 4;
}


message SaveAck {
    bool accepted = 1;
    string replica = 2;
    int32 lamport_timestamp = 3;
}


message ValueQuery {
    string key = 1;
}


message ValueState {
    string key = 1;
    string content = 2;
    int32 lamport_timestamp = 3;
    string origin_replica = 4;
}
