syntax = "proto3";

service RetrievalService {
    rpc RetrieveSimilarLines (RetrievalRequest)
        returns (RetrievalResponse);
}

message RetrievalRequest {
    string character_name = 1;
    string manga_id = 2;
    string query_text = 3;
    int32 limit = 4;
    int32 lamport_timestamp = 5;
}

message ApprovedLine {
    string panel_id = 1;
    string original_japanese = 2;
    string final_output = 3;
    int64 created_at = 4;
}

message RetrievalResponse {
    repeated ApprovedLine lines = 1;
    int32 lamport_timestamp = 2;
}
// ---------------------------------------------------------
// Experiment 5: Deadlock Simulation and Resolution
// ---------------------------------------------------------

service LockService {
    rpc AcquireLock (LockRequest)
        returns (LockReply);

    rpc ReleaseLock (LockRequest)
        returns (LockReply);
}

message LockRequest {
    string resource_id = 1;
    int32 holder_id = 2;
    int32 timestamp = 3;
}

message LockReply {
    bool granted = 1;
    string message = 2;
}
